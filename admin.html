<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Health — Admin Panel</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lato:wght@400;700;900&family=Sora:wght@800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M50%2076%20C31%2059%2021%2047%2021%2037.5%20C21%2029%2027.5%2023.5%2035%2023.5%20C41%2023.5%2046%2027.5%2050%2033.5%20C54%2027.5%2059%2023.5%2065%2023.5%20C72.5%2023.5%2079%2029%2079%2037.5%20C79%2047%2069%2059%2050%2076%20Z%22%20fill%3D%22%23EA7317%22%2F%3E%3Cpolyline%20points%3D%2227%2C49%2040%2C49%2044%2C40%2050%2C59%2055%2C35%2060%2C49%2073%2C49%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
<style>
/* ---- Admin-only styles (storefront vars/fonts come from style.css) ---- */
body{ background:#eef3ef; }
.admin-wrap{ display:flex; min-height:100vh; }

/* ===================== SIDEBAR (desktop) ===================== */
.side{ width:236px; background:var(--pine); color:#c9d3db; flex:0 0 auto; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; z-index:20; }
.side .brand{ display:flex; align-items:center; gap:10px; padding:20px 18px; font-family:var(--display);
  font-weight:800; font-size:19px; color:#fff; border-bottom:1px solid rgba(255,255,255,.1); }
.side .brand .mark{ width:42px; height:42px; flex:0 0 auto; background:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M50%2076%20C31%2059%2021%2047%2021%2037.5%20C21%2029%2027.5%2023.5%2035%2023.5%20C41%2023.5%2046%2027.5%2050%2033.5%20C54%2027.5%2059%2023.5%2065%2023.5%20C72.5%2023.5%2079%2029%2079%2037.5%20C79%2047%2069%2059%2050%2076%20Z%22%20fill%3D%22%23EA7317%22%2F%3E%3Cpolyline%20points%3D%2227%2C49%2040%2C49%2044%2C40%2050%2C59%2055%2C35%2060%2C49%2073%2C49%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat; }
.side .brand .mark::after{ content:none; }
.side .brand small{ display:block; font-family:var(--body); font-weight:500; font-size:10px; color:#9fb0bd; letter-spacing:.08em; text-transform:uppercase; }
.side .brand .bwm{ display:flex; flex-direction:column; gap:1px; }
.side .brand .bn{ font-family:var(--display); font-weight:800; font-size:20px; line-height:1; color:#fff; }
.side .brand .bn .o, .login .lg .bn .o{ color:var(--leaf); }
.login .lg .bn{ font-family:var(--display); font-weight:800; font-size:23px; }
.side nav{ padding:12px; display:flex; flex-direction:column; gap:3px; flex:1; }
.side nav button{ display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:10px; color:#c9d3db;
  font-weight:600; font-size:14px; text-align:left; transition:.15s; width:100%; }
.side nav button:hover{ background:rgba(255,255,255,.08); color:#fff; }
.side nav button.on{ background:var(--leaf); color:#fff; }
.side .logout{ margin:12px; padding:11px 14px; border-radius:10px; background:rgba(255,255,255,.08); color:#fff;
  font-weight:600; font-size:14px; display:flex; align-items:center; gap:10px; justify-content:center; width:calc(100% - 24px); }
.side .logout:hover{ background:var(--rose); }

/* ===================== MAIN AREA ===================== */
.main{ flex:1; min-width:0; }
.topbar{ background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:10; gap:10px; }
.topbar h1{ font-size:20px; }
.topbar .who{ font-size:13px; color:var(--muted); white-space:nowrap; }
.content{ padding:20px 24px; max-width:1100px; padding-bottom:32px; }

/* ===================== STAT CARDS ===================== */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
.stat{ background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; }
.stat .lbl{ font-size:12px; color:var(--muted); font-weight:600; }
.stat .val{ font-family:var(--display); font-weight:800; font-size:26px; margin-top:5px; }
.stat.green .val{ color:var(--leaf); } .stat.amber .val{ color:var(--amber); } .stat.rose .val{ color:var(--rose); }

/* ===================== PANEL / SECTION CARD ===================== */
.panel{ background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:0; overflow:hidden; margin-bottom:20px; }
.panel-head{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.panel-head h2{ font-size:16px; }
.panel-tools{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.panel-tools input, .panel-tools select{ height:36px; border:1.5px solid var(--line); border-radius:9px; padding:0 10px; font-size:14px; font-family:inherit; }

/* ===================== BUTTONS ===================== */
.b{ height:38px; padding:0 16px; border-radius:9px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.b-green{ background:var(--leaf); color:#fff; } .b-green:hover{ background:var(--leaf-d); }
.b-ghost{ background:#fff; border:1.5px solid var(--line); color:var(--ink); } .b-ghost:hover{ border-color:var(--leaf); color:var(--leaf); }
.b-rose{ background:#fff; border:1.5px solid #f3c6cf; color:var(--rose); } .b-rose:hover{ background:var(--rose); color:#fff; }
.b-sm{ height:32px; padding:0 11px; font-size:13px; border-radius:8px; }

/* ===================== TABLE (desktop) ===================== */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:540px; }
th{ text-align:left; padding:11px 14px; background:#f6f9f5; color:var(--muted); font-weight:700; font-size:11px;
  text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); }
td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
.t-img{ width:40px; height:40px; border-radius:9px; object-fit:cover; background:#f5ece2; }
.t-emoji{ width:40px; height:40px; border-radius:9px; background:#f5ece2; display:grid; place-items:center; font-size:20px; }
.pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.pill.goal{ background:#fdeede; color:var(--leaf-d); }
.tag-mini{ font-size:11px; color:var(--muted); }
.row-acts{ display:flex; gap:6px; }

/* ===================== STATUS SELECT ===================== */
.status{ border:1.5px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px; font-weight:600; font-family:inherit; }
.status[data-s="pending"]{ color:var(--amber); border-color:#f6dcae; background:#fff8ee; }
.status[data-s="confirmed"]{ color:#2563EB; border-color:#c5d8fb; background:#eff5ff; }
.status[data-s="delivered"]{ color:var(--leaf-d); border-color:#f5d0b0; background:#fff1e6; }
.status[data-s="cancelled"]{ color:var(--rose); border-color:#f3c6cf; background:#fff5f6; }

.empty{ text-align:center; padding:40px 20px; color:var(--muted); }

/* ===================== MODAL ===================== */
.modal-bg{ position:fixed; inset:0; background:rgba(40,30,22,.5); display:none; align-items:flex-start; justify-content:center;
  padding:20px 12px; z-index:100; overflow-y:auto; }
.modal-bg.open{ display:flex; }
.modal{ background:#fff; border-radius:var(--r-lg); width:100%; max-width:600px; }
.modal-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.modal-head h3{ font-size:18px; } .modal-head button{ font-size:26px; color:var(--muted); line-height:1; }
.modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
.modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; }
.fld{ margin-bottom:13px; } .fld label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.fld input, .fld select, .fld textarea{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
  font-size:15px; font-family:inherit; outline:none; }
.fld input:focus, .fld select:focus, .fld textarea:focus{ border-color:var(--leaf); }
.fld textarea{ resize:vertical; min-height:64px; }
.g2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } 
.g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

/* ===================== ORDER DETAILS ===================== */
.od-row{ display:flex; justify-content:space-between; font-size:14px; padding:5px 0; }
.od-items{ border:1px solid var(--line); border-radius:10px; margin:10px 0; }
.od-items .it{ display:flex; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--line); font-size:14px; }
.od-items .it:last-child{ border-bottom:none; }
.note-box{ background:#fff8ee; border:1px solid #f6dcae; border-radius:10px; padding:12px 14px; font-size:13px; color:#8a6d2f; margin-top:14px; }

/* ===================== LOGIN ===================== */
.login-bg{ min-height:100vh; display:grid; place-items:center; background:
  radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.12), transparent 55%), linear-gradient(145deg,var(--leaf-d),var(--pine)); padding:16px; }
.login{ background:#fff; border-radius:var(--r-lg); padding:30px 26px; width:100%; max-width:380px; box-shadow:var(--shadow-h); }
.login .lg{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800; font-size:22px; color:var(--pine); margin-bottom:6px; }
.login .lg .mark{ width:48px; height:48px; flex:0 0 auto; background:url("data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M50%2076%20C31%2059%2021%2047%2021%2037.5%20C21%2029%2027.5%2023.5%2035%2023.5%20C41%2023.5%2046%2027.5%2050%2033.5%20C54%2027.5%2059%2023.5%2065%2023.5%20C72.5%2023.5%2079%2029%2079%2037.5%20C79%2047%2069%2059%2050%2076%20Z%22%20fill%3D%22%23EA7317%22%2F%3E%3Cpolyline%20points%3D%2227%2C49%2040%2C49%2044%2C40%2050%2C59%2055%2C35%2060%2C49%2073%2C49%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat; }
.login .lg .mark::after{ content:none; }
.login p{ color:var(--muted); font-size:14px; margin:0 0 20px; }
.login label{ font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
.login input{ width:100%; height:48px; border:1.5px solid var(--line); border-radius:12px; padding:0 16px; font-size:15px; outline:none; }
.login input:focus{ border-color:var(--leaf); }
.login .b-green{ width:100%; height:50px; margin-top:16px; font-size:16px; border-radius:12px; justify-content:center; }
.login .err{ color:var(--rose); font-size:13px; margin-top:10px; min-height:18px; }
.login .hint{ font-size:12px; color:var(--muted); margin-top:14px; text-align:center; }

/* ===================== MOBILE BOTTOM NAV ===================== */
.mob-nav{ display:none; }

/* ===================== MOBILE CARD ROWS (orders/products) ===================== */
.m-card-list{ display:none; }
.m-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
.m-card-top{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.m-card-body{ font-size:13px; }
.m-card-row{ display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); }
.m-card-row:last-child{ border-bottom:none; }
.m-card-row span{ color:var(--muted); font-size:12px; }
.m-card-acts{ display:flex; gap:8px; margin-top:12px; }
.m-card-acts .b{ flex:1; justify-content:center; }

/* ===================== CATEGORY MULTI-SELECT DROPDOWN ===================== */
.msd{ position:relative; }
.msd-trigger{
  width:100%; min-height:44px; border:1.5px solid var(--line); border-radius:10px;
  padding:6px 36px 6px 10px; display:flex; align-items:center; flex-wrap:wrap; gap:5px;
  cursor:pointer; background:#fff; transition:.15s; text-align:left; position:relative;
}
.msd-trigger:hover, .msd.open .msd-trigger{ border-color:var(--leaf); }
.msd-trigger::after{
  content:"▾"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font-size:14px; color:var(--muted); transition:.2s; pointer-events:none;
}
.msd.open .msd-trigger::after{ transform:translateY(-50%) rotate(180deg); }
.msd-placeholder{ font-size:14px; color:var(--muted); }
.msd-pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 8px;
  border-radius:999px; background:#eaf5ea; color:var(--leaf-d);
  font-size:12px; font-weight:700; white-space:nowrap;
}
.msd-pill .rm{
  font-size:14px; line-height:1; cursor:pointer; color:var(--leaf-d);
  opacity:.6; margin-left:1px; padding:0 1px;
}
.msd-pill .rm:hover{ opacity:1; }
.msd-menu{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:200;
  background:#fff; border:1.5px solid var(--leaf); border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.13); overflow:hidden; display:none;
}
.msd.open .msd-menu{ display:block; }
.msd-search{
  padding:10px 12px 6px; border-bottom:1px solid var(--line);
}
.msd-search input{
  width:100%; border:1.5px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:13px; font-family:inherit; outline:none;
}
.msd-search input:focus{ border-color:var(--leaf); }
.msd-list{ max-height:224px; overflow-y:auto; padding:6px; }
.msd-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border-radius:8px; cursor:pointer; font-size:14px; font-weight:500;
  transition:.12s; user-select:none;
}
.msd-item:hover{ background:#f6faf5; }
.msd-item.on{ background:#eaf5ea; color:var(--leaf-d); font-weight:700; }
.msd-item .msd-cb{
  width:18px; height:18px; border:2px solid var(--line); border-radius:5px;
  flex:0 0 auto; display:grid; place-items:center; font-size:12px; transition:.12s;
}
.msd-item.on .msd-cb{ background:var(--leaf); border-color:var(--leaf); color:#fff; }
.msd-footer{
  padding:8px 12px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:var(--muted);
}
.msd-footer button{ font-size:12px; color:var(--leaf); font-weight:700; cursor:pointer; }

/* ===================== STATUS BADGE (courier pickup) ===================== */
.stock-badge{ display:inline-block; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
.stock-badge.low{ background:#fff8ee; color:var(--amber); border:1px solid #f6dcae; }

/* ===================== STOCK TOGGLE ===================== */
.stock-toggle{ padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700;
  border:none; cursor:pointer; transition:.15s; white-space:nowrap; }
.stock-toggle.in { background:#e6f5e9; color:#1a7a35; }
.stock-toggle.in:hover { background:#c8eacf; }
.stock-toggle.out{ background:#ffe4e4; color:#c0392b; }
.stock-toggle.out:hover{ background:#ffc9c9; }

/* ===================== COURIER ===================== */
.courier-card{ background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:16px 18px;
  display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.courier-card .cc-logo{ width:44px; height:44px; border-radius:10px; background:var(--cream);
  display:grid; place-items:center; font-size:22px; flex:0 0 auto; }
.courier-card .cc-info{ flex:1; min-width:0; }
.courier-card .cc-name{ font-weight:800; font-size:15px; }
.courier-card .cc-phone{ font-size:13px; color:var(--muted); }
.courier-card .cc-acts{ display:flex; gap:8px; }
.call-btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px;
  background:#e6f5e9; color:#1a7a35; font-weight:700; font-size:13px; text-decoration:none;
  border:1.5px solid #b2dfb8; transition:.12s; }
.call-btn:hover{ background:#1a7a35; color:#fff; }
.courier-track{ font-size:12px; margin-top:4px; color:var(--muted); }

/* ===================== TABLET (820px) ===================== */
@media (max-width:820px){
  .stats{ grid-template-columns:repeat(2,1fr); gap:12px; }
  .side{ width:64px; }
  .side .brand .bwm, .side nav button span:not(.ic), .side .logout span:not(.ic){ display:none; }
  .side .brand{ justify-content:center; padding:16px 0; }
  .side nav button{ justify-content:center; padding:12px; }
  .side .logout{ justify-content:center; padding:12px; }
  .g2,.g3{ grid-template-columns:1fr 1fr; }
  .content{ padding:16px; }
  .topbar{ padding:12px 16px; }
}

/* ===================== MOBILE (600px) ===================== */
@media (max-width:600px){
  /* Hide desktop sidebar, show bottom nav */
  .side{ display:none; }
  .mob-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; height:62px;
    background:var(--pine); border-top:1px solid rgba(255,255,255,.12);
    z-index:50; align-items:stretch; overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .mob-nav button, .mob-nav a{
    flex:1 0 auto; min-width:62px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:#c9d3db; font-size:10px; font-weight:600; font-family:inherit;
    border:none; background:none; cursor:pointer; transition:.15s; padding:6px 4px;
    text-decoration:none; -webkit-tap-highlight-color:transparent;
  }
  .mob-nav button.on{ color:var(--leaf); }
  .mob-nav button:active, .mob-nav a:active{ background:rgba(255,255,255,.08); }

  /* Main adjustments */
  .main{ padding-bottom:62px; }
  .topbar{ padding:12px 14px; }
  .topbar h1{ font-size:17px; }
  .topbar .who{ font-size:12px; }
  .content{ padding:12px 12px 24px; }

  /* Stats — 2 columns on mobile */
  .stats{ grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .stat{ padding:12px 14px; }
  .stat .val{ font-size:22px; }
  .stat .lbl{ font-size:11px; }

  /* Panel head stacks on mobile */
  .panel-head{ flex-direction:column; align-items:stretch; gap:10px; padding:12px 14px; }
  .panel-head h2{ font-size:15px; }
  .panel-tools{ flex-direction:column; gap:8px; }
  .panel-tools input, .panel-tools select{ width:100%; height:42px; font-size:15px; }
  .panel-tools .b{ width:100%; justify-content:center; height:42px; }

  /* Hide desktop table, show mobile cards */
  .table-wrap table{ display:none; }
  .m-card-list{ display:block; padding:10px 12px 12px; }

  /* Modal full screen on mobile */
  .modal-bg{ padding:0; align-items:flex-end; }
  .modal{ border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:92vh; display:flex; flex-direction:column; }
  .modal-body{ flex:1; overflow-y:auto; padding:14px 16px; }
  .modal-head{ padding:14px 16px; }
  .modal-foot{ padding:12px 16px; }
  .modal-foot .b{ flex:1; justify-content:center; height:46px; font-size:15px; }

  /* Form grids collapse */
  .g2,.g3{ grid-template-columns:1fr; gap:0; }

  /* Login */
  .login{ padding:24px 18px; border-radius:var(--r-lg); }

  /* Note box */
  .note-box{ font-size:12px; }
}

/* ===================== v2 ADMIN ADDITIONS ===================== */

/* ============================ HELPERS ============================ */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* onclick="fn(${jsq(x)})" — jekono string ke safe JS string literal banay (order key customer-er deya, tai dorkar) */
const jsq = s => esc(JSON.stringify(String(s==null?'':s)));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const money = n => '৳' + num(n).toLocaleString('en-IN');
const moneyShort = n => { n = num(n); return n >= 100000 ? '৳'+(n/100000).toFixed(n>=1000000?0:1)+'L' : n >= 1000 ? '৳'+(n/1000).toFixed(n>=10000?0:1)+'K' : '৳'+n; };
const itemCount = o => (o.items||[]).reduce((s,i)=> s + num(i.qty), 0);
const isLive = o => !['cancelled','returned'].includes(o.status);
const dayKey = d => { const x = new Date(d); return isNaN(x) ? '' : x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const slugify = s => String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
const normPhone = s => { let d = String(s||'').replace(/\D/g,''); if(d.startsWith('880')) d = d.slice(2); return d; };

    ? c.subs.map(s=>({ id:s.id, label:c.label.replace('Vitamins & ','')+' · '+s.label }))

let products = [], orders = [], banners = [], coupons = [], subscribers = [], reviewsFlat = null;
let aiCfg = { ...AI_DEFAULTS }, aiLogs = [];
let messages = [], posts = [], notices = [], stockAlerts = {};
let categoryImages = {}, heroImage = '', storeSettings = {...DEFAULT_SETTINGS};
let curTab = 'dashboard';
let seeded = false;
const permIssue = {};   // kon node-e rules permission nai (rules publish hoyni)

/* ============================ AUTH ============================ */
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const err   = document.getElementById('loginErr');
  if(!window.fauth){ err.textContent = 'Could not connect to Firebase — check your internet.'; return; }
  if(!email || !pass){ err.textContent = 'Enter your email and password.'; return; }
  err.style.color = 'var(--muted)'; err.textContent = 'Signing in…';
  window.fauth.signInWithEmailAndPassword(email, pass)
    .catch(e=>{ err.style.color = ''; err.textContent = ({
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/wrong-password':'Incorrect password.',
      'auth/user-not-found':'No user with this email.',
      'auth/invalid-email':'Invalid email address.',
      'auth/too-many-requests':'Too many attempts — try again in a few minutes.',
    })[e.code] || e.message; });
}
function forgotPassword(){
  const email = document.getElementById('loginEmail').value.trim();
  const err = document.getElementById('loginErr');
  if(!email){ err.textContent = 'Type your admin email above first, then tap "Forgot password?".'; return; }
  window.fauth.sendPasswordResetEmail(email)
    .then(()=>{ err.style.color = '#1a7a35'; err.textContent = 'Password reset email sent — check your inbox.'; })
    .catch(e=>{ err.style.color = ''; err.textContent = e.message; });
}
function logout(){ if(window.fauth) window.fauth.signOut(); }

/* gate: only the admin email gets in */
if(window.fauth){
  window.fauth.onAuthStateChanged(user=>{
    if(user && user.email === window.ADMIN_EMAIL){ startApp(); }
    else if(user){ window.fauth.signOut(); document.getElementById('loginErr').textContent='This account does not have admin access.'; }
    else { showLogin(); }
  });
} else {
  document.getElementById('loginErr').textContent = 'Firebase did not load. Check your internet / hosting.';
}

function showLogin(){

  loadImgbbKey();

}

function loadCourierKeys(){
  window.fdb.ref('adminConfig/courierKeys').once('value').then(snap=>{

    COURIER_KEYS.sfKey    = d.sfKey    || '';
    COURIER_KEYS.sfSecret = d.sfSecret || '';
  }).catch(e=> console.warn('courierKeys load failed:', e.message));
}
function loadImgbbKey(){
  window.fdb.ref('adminConfig/imgbbKey').once('value').then(snap=>{
    IMGBB_KEY = snap.val() || '';
  }).catch(e=> console.warn('imgbbKey load failed:', e.message));
}

/* ============================ FIREBASE DATA (realtime) ============================ */
function listen(path, onVal, tabs){
  window.fdb.ref(path).on('value', snap=>{
    delete permIssue[path];
    onVal(snap.val());
    if(!tabs || tabs.includes(curTab)) renderCurrent();
  }, err=>{
    console.warn(path+' listener failed:', err.message);
    permIssue[path] = true;
    if(!tabs || tabs.includes(curTab)) renderCurrent();
  });
}
function attachListeners(){
  listen(ADMIN.productsKey, val=>{
    products = val ? Object.values(val).filter(Boolean) : [];
    products.sort((a,b)=>(b.id||0)-(a.id||0));
    if(!products.length && !seeded && typeof PRODUCTS!=='undefined' && PRODUCTS.length){ seeded = true; seedProducts(); }
  }, ['dashboard','products','categories']);
  listen(ADMIN.ordersKey, val=>{
    orders = val ? Object.entries(val).map(([k,v])=>({_key:k, ...v})) : [];
    orders.sort((a,b)=> new Date(b.placedAt||0) - new Date(a.placedAt||0));
    checkNewOrders();
  }, ['dashboard','orders','customers','courier']);
  listen('banners', val=>{
    banners = val ? Object.entries(val).map(([k,v])=>({_key:k, ...v})) : [];
    banners.sort((a,b)=> (a.order||0)-(b.order||0));
  }, ['banners']);
  listen('categoryImages', val=>{ categoryImages = val || {}; }, ['banners']);
  listen('heroImage', val=>{ heroImage = val || ''; }, ['banners']);
  listen('categories', val=>{
    const list = Array.isArray(val) ? val : (val && typeof val==='object' ? Object.values(val) : null);
    CATEGORY_TREE = (list && list.length)
      ? list.filter(c=>c && c.id).map(c=>({ id:c.id, label:c.label||c.id, subs: (Array.isArray(c.subs)?c.subs:Object.values(c.subs||{})).filter(s=>s&&s.id) }))
      : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    rebuildCats();
  }, ['categories','products','banners']);
  listen('settings', val=>{
    storeSettings = {...DEFAULT_SETTINGS, ...(val||{})};
    applyAdminTheme(storeSettings.themeColor);
    const parts = (storeSettings.brand||'My Health').split(' ');
    const bn = `<span class="o">${esc(parts[0])}</span>${parts.length>1?' '+esc(parts.slice(1).join(' ')):''}`;
    document.getElementById('sideBrand').innerHTML = bn;
    document.title = (storeSettings.brand||'My Health') + ' — Admin Panel';
  }, ['settings']);

/* Firebase-কে product.js-এর সাথে EXACTLY মিলিয়ে দেয় (delete + add + update) */
function syncWithProductJs(){
  if(typeof PRODUCTS==='undefined'){ alert('product.js load হয়নি।'); return; }
  const jsIds = new Set(PRODUCTS.map(p=>p.id));
  const liveIds = new Set(products.map(p=>p.id));
  const toDelete = products.filter(p=>!jsIds.has(p.id));
  const toAdd = PRODUCTS.filter(p=>!liveIds.has(p.id));
  const toUpdate = PRODUCTS.filter(p=>liveIds.has(p.id));
  if(!toDelete.length && !toAdd.length && !toUpdate.length){ alert('Firebase আর product.js ইতিমধ্যে সিঙ্ক করা আছে।'); return; }
  const msg = `${toDelete.length}টা প্রোডাক্ট DELETE হবে:\n${toDelete.map(p=>'• '+p.name).join('\n')||'(কিছু নেই)'}\n\n`
            + `${toAdd.length}টা প্রোডাক্ট ADD হবে:\n${toAdd.map(p=>'• '+p.name).join('\n')||'(কিছু নেই)'}\n\n`
            + `${toUpdate.length}টা প্রোডাক্ট UPDATE হবে (product.js-এর latest ডেটা দিয়ে)\n\nএগিয়ে যাব?`;
  if(!confirm(msg)) return;
  const updates = {};
  toDelete.forEach(p=>{ updates[ADMIN.productsKey+'/'+p.id] = null; });
  toAdd.forEach(p=>{ updates[ADMIN.productsKey+'/'+p.id] = p; });
  toUpdate.forEach(p=>{ updates[ADMIN.productsKey+'/'+p.id] = p; });
  window.fdb.ref().update(updates)
    .then(()=> alert(`Sync সম্পূর্ণ! ${toDelete.length}টা মুছে গেছে, ${toAdd.length}টা যোগ হয়েছে, ${toUpdate.length}টা আপডেট হয়েছে।`))
    .catch(e=> alert('Failed: '+e.message));
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach((t,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = i ? 1046 : 784;
      g.gain.setValueAtTime(.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+t+.16);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.18);
    });
  }catch(e){}
}

/* single-series column chart — hover tooltip, rounded data-end, hairline grid */
function drawSalesChart(){
  const box = document.getElementById('salesChart'); if(!box) return;
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push({ key:dayKey(d), label:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}), total:0, count:0 });
  }
  const idx = Object.fromEntries(days.map((d,i)=>[d.key,i]));
  orders.filter(isLive).forEach(o=>{ const i = idx[dayKey(o.placedAt)]; if(i!=null){ days[i].total += num(o.total); days[i].count++; } });

  const W = Math.max(280, box.clientWidth - 28), H = 210, padL = 46, padR = 6, padT = 20, padB = 24;
  const max = Math.max(...days.map(d=>d.total));
  const niceMax = (()=>{ if(!max) return 1000; const m = Math.pow(10, Math.floor(Math.log10(max))); return [1,2,2.5,5,10].map(s=>s*m).find(v=>v>=max); })();
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const slot = plotW/days.length, bw = Math.min(24, slot-6);
  const y = v => padT + plotH - (v/niceMax)*plotH;
  const ticks = [0, .25, .5, .75, 1].map(f=>f*niceMax);
  const maxI = max ? days.findIndex(d=>d.total===max) : -1;
  const step = slot < 34 ? 2 : 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Daily sales for the last 14 days">`;
  ticks.forEach(t=>{ svg += `<line class="grid-l" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${padL-8}" y="${y(t)+4}" text-anchor="end">${moneyShort(t)}</text>`; });
  days.forEach((d,i)=>{
    const x = padL + i*slot + (slot-bw)/2;
    const h = (d.total/niceMax)*plotH, top = padT + plotH - h, r = Math.min(4, h, bw/2);
    svg += `<rect class="hit" x="${padL+i*slot}" y="${padT}" width="${slot}" height="${plotH}" data-i="${i}"/>`;
    svg += h > 0
      ? `<path class="bar" data-b="${i}" d="M${x},${padT+plotH} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${padT+plotH} Z"/>`
      : `<rect class="bar" data-b="${i}" x="${x}" y="${padT+plotH-1}" width="${bw}" height="1" style="opacity:.35"/>`;
    if(i===maxI) svg += `<text class="vlab" x="${x+bw/2}" y="${top-6}" text-anchor="middle">${moneyShort(d.total)}</text>`;
    if((days.length-1-i) % step === 0) svg += `<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  svg += `</svg><div class="chart-tip" id="chartTip"></div>`;
  box.innerHTML = svg;

  const tip = document.getElementById('chartTip');
  box.querySelectorAll('.hit').forEach(el=>{
    const show = ()=>{
      const i = Number(el.dataset.i), d = days[i];
      box.querySelectorAll('.bar').forEach(b=>b.classList.toggle('hl', b.dataset.b==el.dataset.i));
      tip.innerHTML = `<b>${money(d.total)}</b>${esc(d.label)} · ${d.count} order${d.count!==1?'s':''}`;
      const scale = box.querySelector('svg').getBoundingClientRect().width / W;
      tip.style.left = (14 + (padL + i*slot + slot/2)*scale) + 'px';
      tip.style.top = (12 + Math.max(padT, y(d.total))*scale) + 'px';
      tip.style.opacity = 1;
    };
    el.addEventListener('mouseenter', show); el.addEventListener('click', show);
    el.addEventListener('mouseleave', ()=>{ tip.style.opacity = 0; box.querySelectorAll('.bar').forEach(b=>b.classList.remove('hl')); });
  });
  const tot = days.reduce((s,d)=>s+d.total,0), cnt = days.reduce((s,d)=>s+d.count,0);
  document.getElementById('chartSum').innerHTML = `<span>14-day sales <b>${money(tot)}</b></span><span>Orders <b>${cnt}</b></span><span>Best day <b>${max ? esc(days[maxI].label)+' · '+money(max) : '—'}</b></span>`;
}

function previewImgs(){
  const box = document.getElementById('imgPrev'); if(!box) return;
  const urls = [document.getElementById('p_img').value.trim(), ...document.getElementById('p_imgs').value.split('\n').map(s=>s.trim())].filter(Boolean);
  box.innerHTML = urls.map(u=>`<img src="${esc(u)}" alt="" onerror="this.style.opacity=.3">`).join('');
}
function saveProduct(id, copyFrom){
  const v = i => document.getElementById(i).value.trim();
  const name = v('p_name'), price = parseInt(v('p_price'),10);
  if(!name || !(price > 0)){ alert('Name আর Price দিতে হবে।'); return; }
  const selCats = msdGetSelected();
  if(!selCats.length){ alert('অন্তত একটা Category select করতে হবে।'); return; }
  const rating = parseFloat(v('p_rating'));
  /* existing product-er sob field rakhi (stock, onno custom field) — shudhu form-er field update */
  const existing = id!=null ? products.find(x=>x.id===id) : (copyFrom!=null ? products.find(x=>x.id===copyFrom) : null);
  const newId = id!=null ? id : (products.reduce((m,p)=>Math.max(m,num(p.id)),0)+1);
  const data = {
    ...(existing||{}),
    id: newId, name, cats: selCats,
    goal: selCats[0], /* backward compat */
    brand: v('p_brand'),
    price, oldPrice: Math.max(parseInt(v('p_old'),10) || price, price),
    img: v('p_img'),
    imgs: v('p_imgs').split('\n').map(s=>s.trim()).filter(Boolean),
    stock: v('p_stock') === '1',
    qty: v('p_qty') === '' ? null : Math.max(0, parseInt(v('p_qty'),10) || 0),
    sku: v('p_sku'),
    timing: v('p_timing'),
    rating: isFinite(rating) ? Math.max(0, Math.min(5, rating)) : 4.7,
    reviews: Math.max(0, parseInt(v('p_reviews'),10)||0),
    size: v('p_size'), desc: v('p_desc'),
    benefits: v('p_benefits').split('\n').map(s=>s.trim()).filter(Boolean),
    tags: TAGS.filter(t=>document.getElementById('pt_'+t).checked),
    use: { dose: v('p_dose'), when: v('p_when'), duration: v('p_duration') }
  };
  const btn = document.getElementById('saveProdBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  window.fdb.ref(ADMIN.productsKey+'/'+newId).set(data)
    .then(()=>{ closeModal(); })
    .catch(e=>{ btn.disabled = false; btn.textContent = 'Save'; alert('Save failed: '+e.message); });
}

/* ImgBB upload — sob jaygay ekta-i function (product / gallery / banner / hero / category) */
function imgbbUpload(file, statusEl){
  const set = (t,c)=>{ if(statusEl){ statusEl.style.color = c; statusEl.textContent = t; } };
  if(!file) return Promise.reject(new Error('No file'));
  if(!IMGBB_KEY){
    set('ImgBB API key set kora nei — Settings > Image Upload (ImgBB) e key boshao.', '#c0392b');
    return Promise.reject(new Error('no key'));
  }
  if(file.size > 16*1024*1024){ set('File too large (max 16 MB).', '#c0392b'); return Promise.reject(new Error('too large')); }
  set('Uploading…', 'var(--muted)');
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const form = new FormData();
      form.append('image', reader.result.split(',')[1]);
      fetch(`https://api.imgbb.com/1/upload?key=${encodeURIComponent(IMGBB_KEY)}`, { method:'POST', body:form })
        .then(r=>r.json())
        .then(j=>{
          if(j.success && j.data && j.data.url){ set('Uploaded ✓', '#1a7a35'); resolve(j.data.url); }
          else { set('Upload failed: ' + (j.error?.message || 'unknown error'), '#c0392b'); reject(new Error('upload failed')); }
        })
        .catch(e=>{ set('Upload failed: ' + e.message, '#c0392b'); reject(e); });
    };
    reader.onerror = () => { set('File read failed.', '#c0392b'); reject(new Error('read failed')); };
    reader.readAsDataURL(file);
  });
}
function uploadInto(fileId, inputId, statusId, append){
  const fileEl = document.getElementById(fileId);
  imgbbUpload(fileEl.files[0], document.getElementById(statusId)).then(url=>{
    const inp = document.getElementById(inputId);
    inp.value = append && inp.value.trim() ? inp.value.trim() + '\n' + url : url;
    previewImgs();
  }).catch(()=>{}).finally(()=>{ fileEl.value = ''; });
}

/* ================================================================
   MSD — Multi-Select Dropdown engine
   ================================================================ */
let _msdSel = [];
function msdInit(initSel = []) {
  _msdSel = [...initSel];
  msdRenderList('');
  msdRenderTrigger();
  setTimeout(()=>{ document.addEventListener('click', msdOutside); }, 50);
}
function msdOutside(e){
  const msd = document.getElementById('msd');
  if(msd && !msd.contains(e.target)) msdClose();
}
function msdToggle(){
  const msd = document.getElementById('msd');
  if(!msd) return;
  if(msd.classList.contains('open')){ msdClose(); }
  else {
    msd.classList.add('open');
    setTimeout(()=>document.getElementById('msd-search')?.focus(), 60);
  }
}
function msdClose(){ document.getElementById('msd')?.classList.remove('open'); }
function msdFilter(q){ msdRenderList(q.toLowerCase()); }
function msdRenderList(q){
  const list = document.getElementById('msd-list');
  if(!list) return;
  const filtered = q ? CATS.filter(c=>c.label.toLowerCase().includes(q)) : CATS;
  list.innerHTML = filtered.map(c=>{
    const on = _msdSel.includes(c.id);
    return `<div class="msd-item ${on?'on':''}" onclick="msdToggleItem(${jsq(c.id)})">
      <div class="msd-cb">${on?'✓':''}</div>
      <span>${esc(c.label)}</span>
    </div>`;
  }).join('') || `<div style="padding:14px;text-align:center;color:var(--muted);font-size:13px">Nothing found</div>`;
}
function msdToggleItem(id){
  if(_msdSel.includes(id)) _msdSel = _msdSel.filter(x=>x!==id);
  else _msdSel.push(id);
  const q = document.getElementById('msd-search')?.value || '';
  msdRenderList(q.toLowerCase());
  msdRenderTrigger();
}
function msdRenderTrigger(){
  const trigger = document.getElementById('msd-trigger');
  const count   = document.getElementById('msd-count');
  if(!trigger) return;
  trigger.innerHTML = '';
  if(_msdSel.length === 0){
    trigger.innerHTML = `<span class="msd-placeholder">Choose categories…</span>`;
  } else {
    _msdSel.forEach(id=>{
      const pill = document.createElement('span');
      pill.className = 'msd-pill';
      pill.innerHTML = `${esc(catLabel(id))}<span class="rm" onclick="event.stopPropagation();msdRemove(${jsq(id)})">×</span>`;
      trigger.appendChild(pill);
    });
  }
  if(count) count.textContent = `${_msdSel.length} selected`;
}
function msdRemove(id){
  _msdSel = _msdSel.filter(x=>x!==id);
  msdRenderTrigger();
  msdRenderList((document.getElementById('msd-search')?.value || '').toLowerCase());
}
function msdClear(){
  _msdSel = [];
  msdRenderTrigger();
  msdRenderList((document.getElementById('msd-search')?.value || '').toLowerCase());
}
function msdGetSelected(){ return [..._msdSel]; }
function delProduct(id){
  const p = products.find(x=>x.id===id);
  if(!confirm(`Delete "${p?.name}"?\nThis cannot be undone.`)) return;
  window.fdb.ref(ADMIN.productsKey+'/'+id).remove().catch(e=>alert('Delete failed: '+e.message));
}

/* ========================= STOCK (stock:false = out, na thakle in) ========================= */
function stockCell(p){
  const ins = inStockP(p);
  return `<button class="stock-toggle ${ins?'in':'out'}" onclick="stockToggle(${p.id})" title="Click to toggle">${ins ? 'In Stock' : 'Out of Stock'}${typeof p.qty==='number' ? ' · '+p.qty : ''}</button>`;
}
function stockToggle(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  // quantity 0 hoye stock-out hole — notun quantity chai
  if(!inStockP(p) && typeof p.qty === 'number' && p.qty <= 0){
    const v = prompt(`"${p.name}" — new stock quantity?`, '10');
    if(v == null) return;
    const n = Math.max(0, parseInt(v,10) || 0);
    window.fdb.ref(ADMIN.productsKey+'/'+id).update({ qty:n, stock:true }).catch(e=>alert('Stock update failed: '+e.message));
    return;
  }
  window.fdb.ref(ADMIN.productsKey+'/'+id+'/stock').set(!inStockP(p))
    .catch(e=>alert('Stock update failed: '+e.message));
}

/* ============================ CATEGORIES ============================ */
function productsInCat(id){ return products.filter(p=>getCats(p).includes(id)).length; }
function allCatIds(){ return new Set(CATEGORY_TREE.flatMap(c=>[c.id, ...(c.subs||[]).map(s=>s.id)])); }
function uniqueId(label){
  const ids = allCatIds();
  let base = slugify(label) || 'cat', id = base, n = 2;
  while(ids.has(id)) id = base + '-' + (n++);
  return id;
}
function saveCategories(tree, msg){
  return window.fdb.ref('categories').set(tree).then(()=>{ if(msg) atoast(msg); })
    .catch(e=> alert('Save failed: '+e.message + (e.code==='PERMISSION_DENIED' ? '\n\nনতুন firebase-rules.json Publish করুন (SETUP-GUIDE.md দেখুন)।' : '')));
}

const treeCopy = () => JSON.parse(JSON.stringify(CATEGORY_TREE));
function moveCategory(i, d){
  const t = treeCopy(); const [c] = t.splice(i,1); t.splice(i+d,0,c);
  saveCategories(t);
}
function editCategory(i){
  const c = i!=null ? CATEGORY_TREE[i] : null;
  const label = prompt(c ? 'Category name:' : 'New category name (e.g. "Skin Care"):', c ? c.label : '');
  if(label==null || !label.trim()) return;
  const t = treeCopy();
  if(c) t[i].label = label.trim();
  else t.push({ id: uniqueId(label), label: label.trim(), subs: [] });
  saveCategories(t, c ? 'Category renamed ✓' : 'Category added ✓ — now add subcategories');
}
function deleteCategory(i){
  const c = CATEGORY_TREE[i];
  const n = products.filter(p=>getCats(p).some(id=>id===c.id || (c.subs||[]).some(s=>s.id===id))).length;
  if(!confirm(`Delete category "${c.label}"${(c.subs||[]).length?` and its ${c.subs.length} subcategories`:''}?` + (n ? `\n\n⚠️ ${n} product(s) use it — they will stay in the store but won't appear under this category. Re-assign them from Products.` : ''))) return;
  const t = treeCopy(); t.splice(i,1);
  if(!t.length){ alert('At least one category is required.'); return; }
  saveCategories(t, 'Category deleted');
}

function saveCoupon(existing){
  const code = existing || document.getElementById('cp_code').value.trim().toUpperCase();
  const type = document.getElementById('cp_type').value;
  const value = num(document.getElementById('cp_value').value);
  if(!/^[A-Z0-9_-]{2,30}$/.test(code)){ alert('Code must be 2–30 letters/numbers (- and _ allowed).'); return; }
  if(!(value > 0) || (type==='percent' && value > 90)){ alert(type==='percent' ? 'Percent must be between 1 and 90.' : 'Enter a discount amount.'); return; }
  if(!existing && coupons.some(c=>c._key===code)){ alert('This code already exists.'); return; }
  const prev = existing ? coupons.find(c=>c._key===existing) : null;
  const data = {
    type, value, minOrder: num(document.getElementById('cp_min').value),
    expires: document.getElementById('cp_exp').value || '',
    note: document.getElementById('cp_note').value.trim(),
    active: document.getElementById('cp_active').checked,
    createdAt: prev?.createdAt || Date.now()
  };
  window.fdb.ref('coupons/'+code).set(data).then(()=>{ closeModal(); atoast('Coupon saved ✓'); })
    .catch(e=> alert('Save failed: '+e.message + (e.code==='PERMISSION_DENIED' ? '\n\nনতুন firebase-rules.json Publish করুন।' : '')));
}
function toggleCoupon(code){
  const c = coupons.find(x=>x._key===code); if(!c) return;
  window.fdb.ref('coupons/'+code+'/active').set(c.active===false).catch(e=>alert(e.message));
}
function delCoupon(code){
  if(!confirm(`Delete coupon ${code}?`)) return;
  window.fdb.ref('coupons/'+code).remove().catch(e=>alert(e.message));
}

let custSearch = '';
function customerList(){
  const map = {};
  orders.forEach(o=>{
    const ph = normPhone(o.customer?.phone); if(!ph) return;
    const c = map[ph] = map[ph] || { phone:ph, name:'', email:'', district:'', orders:0, spent:0, last:'' };
    c.orders++;
    if(isLive(o)) c.spent += num(o.total);
    if(!c.last || new Date(o.placedAt) > new Date(c.last)){
      c.last = o.placedAt; c.name = o.customer?.name || c.name; c.district = o.customer?.district || c.district; c.email = o.customer?.email || c.email;
    }
  });
  return Object.values(map).sort((a,b)=> b.spent - a.spent);
}

/* ============================ REVIEWS (moderation) ============================ */
function loadAllReviews(){
  reviewsFlat = null; if(curTab==='reviews') renderReviews();
  window.fdb.ref('reviews').once('value').then(snap=>{
    const val = snap.val() || {};
    reviewsFlat = [];
    Object.entries(val).forEach(([pid, list])=> Object.entries(list||{}).forEach(([rid, r])=>{
      if(r) reviewsFlat.push({ pid, rid, ...r });
    }));
    reviewsFlat.sort((a,b)=> num(b.ts)-num(a.ts));
    if(curTab==='reviews') renderReviews();
  }).catch(e=>{ reviewsFlat = []; alert('Could not load reviews: '+e.message); });
}
function renderReviews(){
  const list = reviewsFlat || [];
  const avg = list.length ? (list.reduce((s,r)=>s+num(r.rating),0)/list.length).toFixed(1) : '—';
  document.getElementById('content').innerHTML = `
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="lbl">Total reviews</div><div class="val">${reviewsFlat===null?'…':list.length}</div></div>
      <div class="stat amber"><div class="lbl">Average rating</div><div class="val">${avg}</div></div>
      <div class="stat rose"><div class="lbl">Low ratings (1–2★)</div><div class="val">${list.filter(r=>num(r.rating)<=2).length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Product reviews</h2><div class="panel-tools"><button class="b b-ghost b-sm" onclick="loadAllReviews()">Refresh</button></div></div>
      ${reviewsFlat===null ? `<div class="empty">Loading reviews…</div>` : list.length ? list.map(r=>{
        const p = products.find(x=>String(x.id)===String(r.pid));
        const n = Math.max(0, Math.min(5, Math.round(num(r.rating))));
        return `<div class="rv-adm">
          <div style="flex:1;min-width:0">
            <div><b>${esc(r.name||'Anonymous')}</b> <span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span> <span class="tag-mini">· ${fmtDate(r.ts)}</span></div>
            <div class="tag-mini">on <a href="product.html?id=${encodeURIComponent(r.pid)}" target="_blank" style="text-decoration:underline">${esc(p ? p.name : 'Product #'+r.pid)}</a></div>
            <p>${esc(r.text||'')}</p>
          </div>
          <button class="b b-rose b-sm" onclick="delReview(${jsq(r.pid)},${jsq(r.rid)})">Delete</button>
        </div>`; }).join('') : `<div class="empty">No reviews yet.</div>`}
    </div>
    <div class="note-box">Customers' reviews appear on the product page instantly. Delete spam or abusive reviews here.</div>`;
}
function delReview(pid, rid){
  if(!confirm('Delete this review?')) return;
  window.fdb.ref('reviews/'+pid+'/'+rid).remove()
    .then(()=>{ reviewsFlat = (reviewsFlat||[]).filter(r=>!(r.pid===pid && r.rid===rid)); renderReviews(); })
    .catch(e=>alert(e.message));
}

  document.getElementById('content').innerHTML = `

      <div class="stat"><div class="lbl">Questions (24h)</div><div class="val">${today}</div></div>

async function saveAISettings(){
  const v = id => (document.getElementById('ai_'+id)?.value || '').trim();
  const msg = document.getElementById('aiSaveMsg');
  const show = (t,ok)=>{ msg.style.display='block'; msg.style.color=ok?'#1a7a35':'#c0392b'; msg.textContent=t; };
  const workerUrl = v('workerUrl').replace(/\/+$/,'');
  const mode = v('mode');
  if(workerUrl && !/^https:\/\/[^\s/]+\.[^\s]+$/i.test(workerUrl)){ show('Worker URL must start with https://', false); return; }
  if(mode==='ai' && !workerUrl){ show('AI mode needs the Cloudflare Worker URL (or choose Basic mode).', false); return; }
  const data = {
    enabled: document.getElementById('ai_enabled').checked,
    floatingButton: document.getElementById('ai_floatingButton').checked,
    mode: mode==='ai' ? 'ai' : 'basic',
    model: AI_MODELS.some(m=>m[0]===v('model')) ? v('model') : AI_DEFAULTS.model,
    workerUrl,
    maxProducts: Math.max(2, Math.min(6, num(v('maxProducts'))||4)),
    assistantName: v('assistantName').slice(0,40),
    instructions: v('instructions').slice(0,3000),
    title: v('title').slice(0,120),
    subtitle: v('subtitle').slice(0,300),
    welcome: v('welcome').slice(0,400),
    placeholder: v('placeholder').slice(0,100),
    disclaimer: v('disclaimer').slice(0,300),
    chips: v('chips').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8).map(s=>s.slice(0,40))
  };
  const btn = document.getElementById('aiSaveBtn'); btn.disabled = true;
  try{
    await window.fdb.ref('aiConfig').update(data);   // update — rules ager motoi thake
    atoast('AI settings saved ✓ — live on the website');
  }catch(e){
    show('Save failed: '+e.message + (e.code==='PERMISSION_DENIED' ? ' — publish the new firebase-rules.json first (SETUP-GUIDE.md).' : ''), false);
  }finally{ btn.disabled = false; }
}
async function aiTestConnection(){
  const url = (document.getElementById('ai_workerUrl').value||'').trim();
  const out = document.getElementById('aiTestMsg');
  const show = (t,ok)=>{ out.style.color = ok ? '#1a7a35' : '#c0392b'; out.textContent = t; };
  if(!/^https:\/\//i.test(url)){ show('Enter the Worker URL first (starts with https://).', false); return; }
  show('Checking…', true); out.style.color = 'var(--muted)';
  try{
    const r = await fetch(url, { method:'GET' });
    const j = await r.json().catch(()=>({}));
    if(j.ok && j.configured) show('✓ Connected — Worker is running and the API key + Firebase URL are set. Choose "AI" mode and Save.', true);
    else if(j.ok) show('Worker is running, but ANTHROPIC_API_KEY or FIREBASE_DB_URL is missing in its Settings → Variables and Secrets.', false);
    else show('Reached the URL but it did not answer like the AI Worker (HTTP '+r.status+'). Did you paste ai-worker.js?', false);
  }catch(e){ show('Could not reach the Worker: '+e.message+'. Check the URL, or set ALLOWED_ORIGINS correctly.', false); }
}
async function aiTestQuestion(){
  const url = (document.getElementById('ai_workerUrl').value||'').trim() || aiCfg.workerUrl;
  const q = document.getElementById('aiTestQ').value.trim();
  const out = document.getElementById('aiTestOut');
  if(!/^https:\/\//i.test(url)){ out.innerHTML = '<span style="color:#c0392b">Set the Worker URL above first.</span>'; return; }
  if(!q) return;
  out.innerHTML = '<span style="color:var(--muted)">Thinking…</span>';
  try{
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages:[{ role:'user', content:q }] }) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.reply){
      const why = { not_configured:'API key / Firebase URL missing in the Worker settings', bad_api_key:'The Anthropic API key is wrong or has no credit', busy:'Anthropic is busy or your rate limit was hit — try again', rate_limited:'Too many test questions from this IP — wait 10 minutes', disabled:'The assistant is turned off (Status above) — enable and Save first', origin_not_allowed:'This admin page\'s domain is not in ALLOWED_ORIGINS' }[j.error] || (j.error || ('HTTP '+r.status));
      out.innerHTML = `<span style="color:#c0392b">AI error: ${esc(why)}</span>`; return;
    }
    out.innerHTML = `<div style="background:#fdfaf6;border:1px solid var(--line);border-radius:12px;padding:12px 14px">
      <div>${esc(j.reply).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</div>
      ${(j.products||[]).length ? `<div class="sub-chips">${j.products.map(id=>`<span class="sub-chip" style="padding-right:12px">${esc(products.find(p=>p.id===id)?.name || '#'+id)}</span>`).join('')}</div>` : ''}
      ${j.seeDoctor ? '<div class="tag-mini" style="margin-top:8px;color:#9a3412">⚠️ Marked "see a doctor"</div>' : ''}
      ${(j.followups||[]).length ? `<div class="tag-mini" style="margin-top:8px">Follow-ups: ${j.followups.map(esc).join(' · ')}</div>` : ''}
    </div>`;
  }catch(e){ out.innerHTML = `<span style="color:#c0392b">Could not reach the Worker: ${esc(e.message)}</span>`; }
}

let _rulePick = new Set();
function openAIRule(i){
  const r = i!=null ? aiCfg.rules[i] : null;
  _rulePick = new Set((r?.products||[]).map(Number));
  document.getElementById('modal').innerHTML = `
    <div class="modal-head"><h3>${r?'Edit':'Add'} problem rule</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="fld"><label>Keywords * <span style="font-weight:400;color:var(--muted)">(comma separated — Bangla, Banglish, English)</span></label>
        <input id="rl_kw" value="${esc(r?.keywords||'')}" placeholder="e.g. chul pore, hair fall, চুল পড়া"></div>
      <div class="fld"><label>Advice to show (optional)</label>
        <input id="rl_note" value="${esc(r?.note||'')}" placeholder="e.g. Use the oil 3 times a week for at least 2 months" maxlength="300"></div>
      <div class="fld"><label>Products to recommend first <span id="rl_count" style="font-weight:400;color:var(--muted)"></span></label>
        <input id="rl_search" placeholder="Search products…" oninput="rulePickRender(this.value)" style="margin-bottom:8px">
        <div id="rl_list" style="max-height:280px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:4px"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="b b-ghost" onclick="closeModal()">Cancel</button><button class="b b-green" onclick="saveAIRule(${i==null?'null':i})">Save rule</button></div>`;
  openModal();
  rulePickRender('');
}
function rulePickRender(q){
  q = String(q||'').toLowerCase().trim();
  const list = products.filter(p=> !q || ((p.name||'')+' '+(p.brand||'')).toLowerCase().includes(q))
    .sort((a,b)=> _rulePick.has(b.id) - _rulePick.has(a.id)).slice(0,120);
  document.getElementById('rl_list').innerHTML = list.map(p=>`
    <label class="msd-item ${_rulePick.has(p.id)?'on':''}" style="gap:10px">
      <input type="checkbox" ${_rulePick.has(p.id)?'checked':''} onchange="this.checked?_rulePick.add(${p.id}):_rulePick.delete(${p.id});this.closest('.msd-item').classList.toggle('on',this.checked);document.getElementById('rl_count').textContent='('+_rulePick.size+' selected)'" style="width:16px;height:16px;accent-color:var(--leaf)">
      ${thumb(p)}<span style="flex:1;min-width:0">${esc(p.name)}<div class="tag-mini">${money(p.price)}${inStockP(p)?'':' · out of stock'}</div></span>
    </label>`).join('') || '<div class="empty" style="padding:16px">No products found</div>';
  document.getElementById('rl_count').textContent = `(${_rulePick.size} selected)`;
}
function saveAIRule(i){
  const keywords = document.getElementById('rl_kw').value.split(',').map(s=>s.trim()).filter(Boolean).join(', ');
  if(!keywords){ alert('অন্তত একটা keyword দিন।'); return; }
  if(!_rulePick.size){ alert('অন্তত একটা প্রোডাক্ট select করুন।'); return; }
  const rule = { keywords: keywords.slice(0,300), note: document.getElementById('rl_note').value.trim().slice(0,300), products: [..._rulePick].slice(0,6) };
  const rules = (aiCfg.rules||[]).map(r=>({ keywords:r.keywords, note:r.note||'', products:r.products||[] }));
  if(i!=null) rules[i] = rule; else rules.push(rule);
  window.fdb.ref('aiConfig/rules').set(rules).then(()=>{ closeModal(); atoast('Rule saved ✓'); })
    .catch(e=> alert('Save failed: '+e.message + (e.code==='PERMISSION_DENIED' ? '\n\nনতুন firebase-rules.json Publish করুন।' : '')));
}
function delAIRule(i){
  if(!confirm('Delete this rule?')) return;
  const rules = (aiCfg.rules||[]).filter((_,j)=>j!==i).map(r=>({ keywords:r.keywords, note:r.note||'', products:r.products||[] }));
  window.fdb.ref('aiConfig/rules').set(rules.length ? rules : null).catch(e=>alert(e.message));
}
function exportAILogs(){
  const name = id => products.find(p=>String(p.id)===String(id))?.name || id;
  const rows = aiLogs.map(l=>[new Date(num(l.ts)).toISOString(), l.q, l.mode, String(l.products||'').split(',').filter(Boolean).map(name).join(' | ')].map(csvCell).join(','));

function clearAILogs(){

  window.fdb.ref('couriers').on('value', snap=>{

async function submitPickup(orderKey, orderId){
  const courierId = document.getElementById('pu_courier').value;
  const note      = document.getElementById('pu_note').value.trim();
  const codAmount = Math.max(0, num(document.getElementById('pu_cod').value));
  const o = orders.find(x=>x._key===orderKey);
  const btn = document.querySelector('.modal-foot .b-green');
  const reset = ()=>{ if(btn){ btn.disabled=false; btn.textContent='Pickup Request দাও'; } };
  if(btn){ btn.disabled=true; btn.textContent='পাঠানো হচ্ছে…'; }

  let consignment_id=null, tracking_code=null, courierStatus='manual';

  /* API courier hole Worker diye DIRECT parcel; custom courier hole sudhu local record */
  if(o && API_COURIERS.includes(courierId)){
    if(courierId === 'steadfast' && (!COURIER_KEYS.sfKey || !COURIER_KEYS.sfSecret)){
      reset();
      return alert('Steadfast Api-Key/Secret-Key boshano nei.\nSettings → Courier API te key boshiye Save koro, tarpor abar try koro.');
    }
    try {
      const addr = [o.customer?.address, o.customer?.district, o.customer?.division].filter(Boolean).join(', ');
      const res  = await fetch(COURIER_WORKER, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          courier: courierId,
          api_key:    COURIER_KEYS.sfKey,
          secret_key: COURIER_KEYS.sfSecret,
          invoice: orderId,
          recipient_name:  o.customer?.name  || '',
          recipient_phone: o.customer?.phone || '',
          recipient_address: addr,
          cod_amount: codAmount,
          note
        })
      });
      const data = await res.json().catch(()=>({}));
      if(data.ok){
        consignment_id = data.consignment_id;
        tracking_code  = data.tracking_code;
        courierStatus  = data.status || 'sent';
      } else {
        reset();
        return alert(courierId+' এ parcel পাঠাতে পারলাম না:\n'
          + (data.error || data.message || 'Unknown error')
          + '\n\n(Internet / Worker-er API key check করো, নাহলে courier app এ manually add করো।)');
      }
    } catch(err){
      reset();
      return alert('Worker call fail হলো: ' + err.message + '\nInternet check করো।');
    }
  }

  const key  = 'pu_' + Date.now();
  const data = { orderId, orderKey, courierId, note, codAmount, consignment_id, tracking_code,
                 status:'pending', courierStatus, requestedAt:new Date().toISOString() };
  try {
    await window.fdb.ref('pickups/'+key).set(data);
    const upd = { status:'shipped', courier: courierId };
    upd['statusHistory/shipped'] = Date.now();
    if(!o?.statusHistory?.confirmed) upd['statusHistory/confirmed'] = Date.now();
    if(consignment_id) upd.consignment_id = consignment_id;
    if(tracking_code)  upd.tracking_code  = tracking_code;
    await window.fdb.ref(ADMIN.ordersKey+'/'+orderKey).update(upd);
    syncInventory(orderKey, 'shipped').catch(()=>{});
    closeModal();
    alert(consignment_id
      ? `Steadfast এ parcel create হলো!\nConsignment: ${consignment_id}\nTracking: ${tracking_code||'-'}\n\nOrder status → Shipped`
      : 'Pickup request saved! Order status → Shipped. Courier tab এ দেখো।');
  } catch(e){
    reset();
    alert('Firebase save failed: ' + e.message);
  }
}
function pickupDone(key){
  window.fdb.ref('pickups/'+key+'/status').set('done').catch(e=>alert(e.message));

  if(!confirm('এই pickup request মুছে দেবো?')) return;

/* STOCK QUANTITY — order confirm/ship/deliver hole product-er qty kome,
   cancel/return hole ferot ase. Shudhu jei product-e qty deya ache (number). Ekbar-i hoy (stockDeducted flag). */
async function syncInventory(key, status){
  const o = orders.find(x=>x._key===key); if(!o) return;
  const wantTake = ['confirmed','shipped','delivered'].includes(status);
  const wantGive = ['cancelled','returned'].includes(status);
  if(!wantTake && !wantGive) return;
  /* flag-ta database-e transaction diye "claim" kori — tara-tari duibar click korleo stock ekbar-i kombe/barbe */
  const claim = await window.fdb.ref(ADMIN.ordersKey+'/'+key+'/stockDeducted').transaction(cur => {
    if(wantTake && !cur) return true;
    if(wantGive && cur) return false;
    return;   // kichu korar nai — abort
  });
  if(!claim || !claim.committed) return;
  const take = wantTake;
  const sign = take ? -1 : 1;
  const touched = [];
  for(const it of (o.items||[])){
    const p = products.find(x=>x.id===num(it.id));
    if(!p || typeof p.qty !== 'number') continue;
    await window.fdb.ref(ADMIN.productsKey+'/'+p.id+'/qty').transaction(q => typeof q === 'number' ? Math.max(0, q + sign*num(it.qty)) : q);
    touched.push(p.name);
  }
  if(touched.length) atoast(take ? `Stock reduced for ${touched.length} product(s)` : `Stock returned for ${touched.length} product(s)`);
}

/* website-er moto admin-eo theme color (app.js applyTheme er sathe mil) */
function applyAdminTheme(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim()); if(!m) return;
  const n = parseInt(m[1],16), rgb = [n>>16&255, n>>8&255, n&255];
  const mix = (t,w) => '#' + rgb.map(c=>Math.round(c+(t-c)*w).toString(16).padStart(2,'0')).join('');
  const r = document.documentElement.style;
  r.setProperty('--leaf', '#'+m[1]); r.setProperty('--leaf-d', mix(0,.14)); r.setProperty('--leaf-dd', mix(0,.38));
  r.setProperty('--leaf-l', mix(255,.84)); r.setProperty('--leaf-ll', mix(255,.94)); r.setProperty('--brand-rgb', rgb.join(','));
}
async function saveStoreSettings(){
  const v = id => (document.getElementById('st_'+id)?.value || '').trim();
  const msg = document.getElementById('stMsg');
  const show = (t,ok)=>{ msg.style.display='block'; msg.style.color=ok?'#1a7a35':'#c0392b'; msg.textContent=t; };
  const data = {};
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{
    const el = document.getElementById('st_'+k); if(!el) return;
    data[k] = typeof DEFAULT_SETTINGS[k] === 'number' ? Math.max(0, num(el.value)) : el.value.trim();
  });
  if(!data.brand){ show('Store name is required.', false); return; }
  data.siteUrl = data.siteUrl.replace(/\/+$/,'');
  if(data.whatsapp && !/x/i.test(data.whatsapp)){
    let w = data.whatsapp.replace(/[^0-9]/g,'');
    if(/^01\d{9}$/.test(w)) w = '88' + w;            // 01XXXXXXXXX -> 8801XXXXXXXXX
    if(!/^8801\d{9}$/.test(w)){ show('WhatsApp number must look like 8801XXXXXXXXX', false); return; }
    data.whatsapp = w;
  }
  for(const k of ['facebook','instagram','youtube','tiktok']){
    if(data[k] && !/^https?:\/\//i.test(data[k])){ show(`${k} link must start with https://`, false); return; }
  }
  if(!/^#[0-9a-f]{6}$/i.test(data.themeColor)) data.themeColor = DEFAULT_SETTINGS.themeColor;
  if(data.gaId && !/^G-[A-Z0-9]+$/i.test(data.gaId)){ show('Google Analytics ID must look like G-XXXXXXXXXX', false); return; }
  if(data.fbPixel && !/^[0-9]{6,20}$/.test(data.fbPixel)){ show('Facebook Pixel ID must be numbers only', false); return; }
  for(const k of ['bkash','nagad']){
    if(data[k] && !/^01[0-9]{9}$/.test(data[k].replace(/\D/g,''))){ show(`${k} number must be an 11-digit mobile number (01XXXXXXXXX)`, false); return; }
    data[k] = data[k].replace(/\D/g,'');
  }
  const btn = document.getElementById('stSaveBtn'); btn.disabled = true;
  try{
    await window.fdb.ref('settings').set(data);
    show('Saved ✓ — the website now uses these settings.', true);
    atoast('Store settings saved ✓');
  }catch(e){
    show('Save failed: '+e.message + (e.code==='PERMISSION_DENIED' ? ' — publish the new firebase-rules.json first (see SETUP-GUIDE.md).' : ''), false);
  }finally{ btn.disabled = false; }
}

async function saveCourierKeys(){
  const k = (document.getElementById('sfApiKey').value||'').trim();
  const s = (document.getElementById('sfApiSecret').value||'').trim();
  const msg = document.getElementById('sfKeyMsg');
  const show = (t,ok)=>{ msg.style.display='block'; msg.style.color=ok?'#1a7a35':'#c0392b'; msg.textContent=t; };
  if(!k && !s){ show('Paste a key first.', false); return; }
  const payload = {};
  if(k) payload.sfKey = k;
  if(s) payload.sfSecret = s;
  try{
    await window.fdb.ref('adminConfig/courierKeys').update(payload);
    if(k) COURIER_KEYS.sfKey = k;
    if(s) COURIER_KEYS.sfSecret = s;
    renderSettings();
    atoast('Steadfast keys saved ✓');
  }catch(e){ show('Save failed: '+e.message, false); }
}

function siteBase(){ const u = (storeSettings.siteUrl||'').trim(); return (u && !/YOUR-DOMAIN/i.test(u) ? u : SITE_BASE_URL).replace(/\/+$/,''); }
function downloadSitemap(){
  const base = siteBase();
  const today = new Date().toISOString().slice(0,10);
  const staticPages = ['', 'category.html?goal=all', 'category.html?goal=all&tag=flash', 'blog.html', 'health-tools.html', 'compare.html', 'track.html',
    'page.html?p=about', 'page.html?p=contact', 'page.html?p=delivery',
    'page.html?p=return', 'page.html?p=privacy', 'page.html?p=terms', 'page.html?p=faq'];
  const xmlEsc = s => String(s).replace(/&/g,'&amp;');
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  const add = p => { xml += `  <url><loc>${xmlEsc(base+'/'+p)}</loc><lastmod>${today}</lastmod><changefreq>weekly</changefreq></url>\n`; };
  staticPages.forEach(add);
  TOP_CATEGORIES.forEach(c=> add('category.html?goal='+encodeURIComponent(c.id)));
  CATEGORY_TREE.forEach(c=> (c.subs||[]).forEach(s=> add('category.html?goal='+encodeURIComponent(s.id))));
  products.forEach(p=> add('product.html?id='+p.id));
  posts.filter(p=>p.published!==false).forEach(p=> add('blog.html?id='+encodeURIComponent(p._key)));
  xml += '</urlset>\n';
  download('sitemap.xml', xml, 'application/xml;charset=utf-8');
  alert(`sitemap.xml ডাউনলোড হচ্ছে (${products.length}টি প্রোডাক্ট)।\nএবার ফাইলটা হোস্টিংয়ের root ফোল্ডারে আপলোড করো।`
    + (/YOUR-DOMAIN/i.test(base) ? '\n\n⚠️ Website URL এখনো সেট করা নেই — Settings → Store Settings → Website URL-এ আসল ডোমেইন দিয়ে আবার ডাউনলোড করো!' : ''));
}
function download(name, text, type){
  const blob = new Blob([text], {type:type||'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
/* CSV cell — Excel formula injection (=, +, -, @) atkate ' prefix */
const csvCell = v => { let s = String(v==null?'':v); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g,'""')}"`; };
function exportProducts(){
  const header = `/* ${storeSettings.brand||'MY HEALTH'} — product.js backup (admin theke export)
   Use korte: ei file-er bhitor-er sob copy kore product.js e paste koro (ba file rename kore product.js koro). */\n\n`;
  download('product.js.txt', header + 'const PRODUCTS = ' + JSON.stringify(products, null, 2) + ';\n', 'text/plain');
}
function exportOrders(list){
  const head = ['Order ID','Date','Name','Phone','Email','Division','District','Address','Note','Items','Subtotal','Discount','Coupon','Delivery','Total','Payment','TrxID','Payment status','Status','Tracking'];
  const rows = (list||orders).map(o=>{
    const c=o.customer||{};
    const items=(o.items||[]).map(i=>`${i.name} x${num(i.qty)}`).join(' | ');
    return [o.id, o.placedAt, c.name, c.phone, c.email, c.division, c.district, c.address, c.note, items, o.subtotal, o.discount, o.coupon, o.delivery, o.total, o.payment, o.paymentInfo?.trxId, o.paymentStatus, o.status, o.tracking_code]
      .map(csvCell).join(',');
  });
  download(`orders-${new Date().toISOString().slice(0,10)}.csv`, '﻿' + [head.join(','), ...rows].join('\n'), 'text/csv;charset=utf-8');
}
function exportCustomers(){
  const head = ['Name','Phone','Email','District','Orders','Total spent','Last order'];
  const rows = customerList().map(c=>[c.name,c.phone,c.email,c.district,c.orders,c.spent,c.last].map(csvCell).join(','));
  download(`customers-${new Date().toISOString().slice(0,10)}.csv`, '﻿' + [head.join(','), ...rows].join('\n'), 'text/csv;charset=utf-8');
}
function exportSubscribers(){
  const rows = subscribers.map(s=>[s.email, new Date(num(s.ts)).toISOString()].map(csvCell).join(','));
  download('subscribers.csv', '﻿' + ['Email,Subscribed', ...rows].join('\n'), 'text/csv;charset=utf-8');
}

/* ============================ MODAL ============================ */
function openModal(){ document.getElementById('modalBg').classList.add('open'); }
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.removeEventListener('click', msdOutside);
}
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if(appStarted && h !== curTab && TABS.some(t=>t[0]===h)) go(h); });
</script>
