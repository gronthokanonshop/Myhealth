<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<title>Information — My Health</title>
<meta name="description" content="My Health — about us, delivery, return policy, privacy, terms and FAQ for authentic supplements in Bangladesh." />
<meta name="theme-color" content="#3BB77E" />
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lato:wght@400;700;900&family=Sora:wght@800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M50%2076%20C31%2059%2021%2047%2021%2037.5%20C21%2029%2027.5%2023.5%2035%2023.5%20C41%2023.5%2046%2027.5%2050%2033.5%20C54%2027.5%2059%2023.5%2065%2023.5%20C72.5%2023.5%2079%2029%2079%2037.5%20C79%2047%2069%2059%2050%2076%20Z%22%20fill%3D%22%23EA7317%22%2F%3E%3Cpolyline%20points%3D%2227%2C49%2040%2C49%2044%2C40%2050%2C59%2055%2C35%2060%2C49%2073%2C49%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <div class="crumb"><a href="index.html">Home</a><span>›</span><span id="crumbPage">Information</span></div>
  <article class="info-page" id="infoPage"></article>
</main>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="product.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
<script>
window.NO_LIVE_RERENDER = true; /* static content — live product update e re-render dorkar nei */

function initPage(){
  const key = (param('p') || 'about').toLowerCase();
  const page = PAGES[key] || PAGES.about;

  // template placeholders fill (CONFIG theke)
  const fill = s => s
    .replace(/\{brand\}/g, esc(CONFIG.brand))
    .replace(/\{hotline\}/g, esc(CONFIG.hotline || '—'))
    .replace(/\{whatsapp\}/g, esc(waNumber() ? '+' + waNumber() : '—'))
    .replace(/\{waLink\}/g, waNumber() ? waLink('Hi! I have a question.') : '#')
    .replace(/\{email\}/g, esc(CONFIG.email || '—'))
    .replace(/\{address\}/g, esc(CONFIG.address || '—'))
    .replace(/\{deliveryFeeOuter\}/g, CONFIG.deliveryFeeOuter)
    .replace(/\{deliveryFee\}/g, CONFIG.deliveryFee)
    .replace(/\{freeDeliveryLine\}/g, freeDeliveryOn() ? `<li><b>FREE delivery</b> on orders over <b>${money(CONFIG.freeDeliveryOver)}</b> — anywhere in Bangladesh.</li>` : '')
    .replace(/\{freeDeliveryOver\}/g, Number(CONFIG.freeDeliveryOver).toLocaleString('en-IN'))
    .replace(/\{productCount\}/g, Math.max(1, Math.floor(PRODUCTS.length / 10) * 10))
    .replace(/\{brandCount\}/g, Math.max(1, Math.floor(new Set(PRODUCTS.map(p=>p.brand).filter(Boolean)).size / 5) * 5))
    .replace(/\{categoryCount\}/g, CATEGORIES.length);

  document.title = page.title + " — " + CONFIG.brand;
  document.getElementById('crumbPage').textContent = page.title;
  document.getElementById('infoPage').innerHTML = `
    <div class="info-hero"><h1>${page.title}</h1></div>
    ${key === 'contact' ? contactHTML() : `<div class="info-body">${fill(page.html)}</div>`}`;
}

/* ---------- CONTACT — card + message form (admin > Messages e jay) ---------- */
function contactHTML(){
  const wa = waNumber(), hot = CONFIG.hotline;
  const cards = [
    hot ? [ICO.phone, 'Call us', `<a href="tel:${esc(hot)}">${esc(hot)}</a>`] : null,
    wa  ? [WA_ICON, 'WhatsApp', `<a href="${waLink('Hi! I have a question.')}" target="_blank" rel="noopener">Chat with us →</a>`] : null,
    CONFIG.email ? [ICO.mail, 'Email', `<a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a>`] : null,
    CONFIG.address ? [ICO.pin, 'Address', esc(CONFIG.address)] : null,
    [ICO.clock, 'Business hours', 'Every day, 9:00 AM – 10:00 PM'],
  ].filter(Boolean);
  return `
  <div class="contact-grid">
    <div class="contact-cards">
      ${cards.map(([ic,t,v])=>`<div class="cc-card"><span class="cc-ico">${ic}</span><div><b>${t}</b><span>${v}</span></div></div>`).join('')}
      <p class="tag-mini" style="margin:6px 4px 0">To check an order, use <a href="track.html" style="color:var(--leaf);font-weight:700">Track Order</a>.</p>
    </div>
    <form class="info-body contact-form" id="contactForm" onsubmit="event.preventDefault(); sendMessage();">
      <h3>Send us a message</h3>
      <p class="tag-mini" style="margin:-4px 0 16px;font-size:13.5px">Fill out the form and we'll get back to you within 24 hours.</p>
      <div class="f2">
        <div class="field" id="cwName"><label for="cName">Full name *</label><input id="cName" maxlength="80" autocomplete="name"><div class="field-err">Please enter your name</div></div>
        <div class="field" id="cwPhone"><label for="cPhone">Phone *</label><input id="cPhone" type="tel" maxlength="20" placeholder="01XXXXXXXXX" autocomplete="tel"><div class="field-err">Enter a valid mobile number</div></div>
      </div>
      <div class="f2">
        <div class="field" id="cwEmail"><label for="cEmail">Email (optional)</label><input id="cEmail" type="email" maxlength="100" autocomplete="email"><div class="field-err">Enter a valid email</div></div>
        <div class="field"><label for="cSubject">Subject</label><select id="cSubject"><option>Product question</option><option>Order / delivery</option><option>Return or refund</option><option>Wholesale / bulk order</option><option>Other</option></select></div>
      </div>
      <div class="field" id="cwMsg"><label for="cMsg">Message *</label><textarea id="cMsg" maxlength="1500" placeholder="How can we help?"></textarea><div class="field-err">Please write your message (at least 10 characters)</div></div>
      <button class="btn btn-green" id="cSend" type="submit">Send message</button>
    </form>
  </div>`;
}
function sendMessage(){
  const v = id => document.getElementById(id).value.trim();
  const name = v('cName'), phone = normalizePhone(v('cPhone')), email = v('cEmail'), msg = v('cMsg');
  const bad = (id, b) => { document.getElementById(id).classList.toggle('invalid', !!b); return !!b; };
  let err = false;
  err = bad('cwName', !name) || err;
  err = bad('cwPhone', !/^01\d{9}$/.test(phone)) || err;
  err = bad('cwEmail', email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) || err;
  err = bad('cwMsg', msg.length < 10) || err;
  if(err) return;
  try{ const last = Number(localStorage.getItem('myhealth_msg_ts'))||0; if(Date.now() - last < 60000){ toast('Please wait a minute before sending another message'); return; } }catch(e){}
  if(!window.fdb){ toast('Could not send — please call or WhatsApp us'); return; }
  const btn = document.getElementById('cSend'); btn.disabled = true; btn.textContent = 'Sending…';
  const data = { name, phone, subject: v('cSubject'), message: msg, ts: Date.now() };
  if(email) data.email = email;
  window.fdb.ref('messages').push(data).then(()=>{
    try{ localStorage.setItem('myhealth_msg_ts', String(Date.now())); }catch(e){}
    document.getElementById('contactForm').innerHTML = `<div class="success" style="margin:0;border:none;padding:30px 10px"><div class="ok">✓</div><h1>Message sent!</h1><p>Thank you, ${esc(name)}. We'll get back to you on ${esc(phone)} soon.</p></div>`;
  }).catch(()=>{ btn.disabled = false; btn.textContent = 'Send message'; toast('Could not send right now — please call or WhatsApp us'); });
}
</script>
</body>
</html>
