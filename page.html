<div id="site-header"></div>

<main class="wrap">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="product.js"></script>
<script src="app.js"></script>
<script>
window.NO_LIVE_RERENDER = true; /* static content — live product update e re-render dorkar nei */

function initPage(){
  const key = (param('p') || 'about').toLowerCase();
  const page = PAGES[key] || PAGES.about;

  // template placeholders fill (CONFIG theke)
  const fill = s => s
    .replace(/\{brand\}/g, CONFIG.brand)
    .replace(/\{hotline\}/g, CONFIG.hotline)
    .replace(/\{whatsapp\}/g, CONFIG.whatsapp)
    .replace(/\{waLink\}/g, waLink('Hi! I have a question.'))
    .replace(/\{email\}/g, CONFIG.email)
    .replace(/\{address\}/g, CONFIG.address)
    .replace(/\{deliveryFeeOuter\}/g, CONFIG.deliveryFeeOuter)
    .replace(/\{deliveryFee\}/g, CONFIG.deliveryFee)
    .replace(/\{freeDeliveryOver\}/g, Number(CONFIG.freeDeliveryOver).toLocaleString('en-IN'));

  document.title = page.title + " — " + CONFIG.brand;
  document.getElementById('crumbPage').textContent = page.title;
  document.getElementById('infoPage').innerHTML = `
    <div class="info-hero"><h1>${page.title}</h1></div>
    <div class="info-body">${fill(page.html)}</div>`;
}
</script>
</body>
